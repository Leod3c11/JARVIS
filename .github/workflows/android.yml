name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native acceleration build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Stage Vulkan headers in Android NDK sysroot
        run: |
          NDK_SYSROOT="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          test -f /usr/include/vulkan/vulkan.hpp
          mkdir -p "$NDK_SYSROOT/vulkan" "$NDK_SYSROOT/vk_video"
          cp -a /usr/include/vulkan/. "$NDK_SYSROOT/vulkan/"
          cp -a /usr/include/vk_video/. "$NDK_SYSROOT/vk_video/"
          mkdir -p "$NDK_SYSROOT/spirv"
          cp -a /usr/include/spirv/. "$NDK_SYSROOT/spirv/"
          test -f "$NDK_SYSROOT/vulkan/vulkan.hpp"
          test -f "$NDK_SYSROOT/spirv/unified1/spirv.hpp"
          test -x "$(command -v glslc)"
          test -f /usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake
          test -f "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/28/libvulkan.so"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
